main:
 - title: "도시규모분포에 관한 연구: 분포결정요인과 공간정책의 후생효과"
   title_eng: "On City Size Distribution: Determinants, Spatial Policies, and Welfare"
   series: KDI 정책연구시리즈
   date: 2025
   pdf: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6492261
   abstract: 수도권 인구집중과 그 대응은 우리나라 최대 현안 중 하나이다. 본 연구는 수량적 공간일반균형모형을 활용하여 우리나라 도시규모분포의 결정요인을 구조적으로 추정하고, 지역정책의 효과와 현행 인구분포의 최적성을 정량적으로 분석함으로써 지역발전정책의 접근법과 가능성을 검토한다. 전국 161개 시군을 도시로 정의하고 2005~19년 자료를 분석한 결과, 동 기간 수도권 인구 비중 증가를 추동한 요인은 총요소생산성 격차였으며, 쾌적도와 인구수용비용 등 다른 요인은 이를 억제하는 방향으로 작동했다. 특히 2010년대에 발생한 거제, 구미, 울산 등 비수도권 제조업 도시의 총요소생산성 하락이 수도권 집중을 가속화했다. 2010년대 인구분산정책, 즉 혁신도시와 세종시 건설은 인프라 개선을 통해 해당 도시 인구를 일정 수준 성장시켰으나, 총요소생산성 개선이 부진하여 도시 성장 및 수도권 집중 완화 효과는 제한적이었다. 비수도권 7개 도시를 권역별 거점도시로 선정하여 육성하는 가상실험 결과, 수도권 비중을 2000년 수준으로 낮추기 위해서는 상당한 수준의 총요소생산성 및 인프라 효율성 개선이 필요하다. 이를 후생손실 없이 정당화할 수 있는 정책비용 상한 폭은 제한적이다. 이러한 투자로도 수도권 비중은 여전히 인구의 절반에 가깝다. 최적공간정책 분석 결과, 집적경제의 효율적 활용을 위해서는 전국 대도시로의 인구집중이 권고된다. 이때 서울뿐 아니라 부산 대구 광주 등 비수도권 대도시로도 인구가 재배치되어 수도권 집중은 2019년 수준에서 더 심화되지 않을 수 있다. 이 결과는 세 가지 시사점을 제공한다. 첫째, 수도권 집중의 핵심 요인은 생산성 변화로서, 지역발전정책이 실효성을 갖기 위해서는 생산성을 실질적으로 향상시키는 정책수단의 개발이 선행되어야 한다. 둘째, 낙관적 시나리오에서도 수도권 비중을 43% 이하로 낮추기 어려우며, 정책개입에는 선택과 집중이 요구된다. 셋째, 최적공간정책은 대도시 집중을 권고하나 이것이 반드시 수도권 집중 심화로 연결되지는 않는다. 수도권 집중 심화 방지가 목적이라면 권역별 거점도시 육성을 통한 선제적 공간구조 재편이 유효할 수 있다.

 - title: "수도권 집중은 왜 계속되는가: 인구분포 결정요인과 공간정책 함의"
   title_eng: "Why the Capital Region Keeps Growing: Urban Accounting and Spatial Policy Implications"
   series: KDI FOCUS
   date: 2026
   pdf: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6477419
   pdf_eng: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6477441
   youtube: https://www.youtube.com/watch?v=0jSoSMO6uCk